<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Mi Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #1e2a3a; color: white; transition: all 0.3s; z-index: 1000; }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #9b59b6; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item { display: block; padding: 12px 20px; color: #ecf0f1; text-decoration: none; transition: 0.3s; }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active { background: #9b59b6; color: white; }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        .main-content { margin-left: 260px; transition: 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .navbar { padding: 0.75rem 1.5rem; background: #9b59b6; color: white; }
        .info-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .btn-refresh { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        @media (max-width: 768px) { .sidebar { margin-left: -260px; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-building"></i> InternSys</h4><small>Empresa</small></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-company.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="company-offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Mis Ofertas</a></li>
            <li><a href="company-assignments.html" class="menu-item"><i class="fas fa-handshake"></i> Mis Asignaciones</a></li>
            <li><a href="company-applications.html" class="menu-item"><i class="fas fa-file-alt"></i> Postulaciones</a></li>
            <li><a href="company-profile.html" class="menu-item active"><i class="fas fa-building"></i> Mi Empresa</a></li>
            <li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar"><div class="container-fluid"><button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button><span class="navbar-brand mb-0 h4">Mi Empresa</span><button class="btn btn-light" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button></div></nav>
        <div class="container-fluid mt-4"><div class="text-end mb-3"><button class="btn-refresh" onclick="loadCompanyData()"><i class="fas fa-sync-alt"></i> Refrescar</button></div>
        <div class="row"><div class="col-md-8 mx-auto"><div class="info-card"><h4 class="text-center"><i class="fas fa-building me-2"></i>Información de la Empresa</h4><hr><div id="companyInfo"></div><div class="text-center mt-3"><button class="btn btn-primary" onclick="enableEdit()"><i class="fas fa-edit"></i> Editar</button></div></div></div></div></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/api.js"></script>
    <script>
        let currentCompany = null;
        function getCurrentUser() { const user = localStorage.getItem('internsys_user'); return user ? JSON.parse(user) : null; }
        function cerrarSesion() { localStorage.removeItem('internsys_user'); window.location.href = 'index.html'; }
        function showAlert(title, message, type = 'success') { Swal.fire({ title, text: message, icon: type, confirmButtonColor: '#9b59b6' }); }
        async function loadCompanyData() { const user = getCurrentUser(); if (!user || user.rol !== 'empresa') return; try { const empresas = await CompanyService.getAll(); currentCompany = (empresas.result || []).find(e => e.id === user.empresa_id); if (currentCompany) displayCompanyInfo(currentCompany); } catch(e) { showAlert('Error', 'Error al cargar datos', 'error'); } }
        function displayCompanyInfo(company) { document.getElementById('companyInfo').innerHTML = `<table class="table table-bordered"><tr><th width="35%">Nombre</th><td><span id="display_name">${company.name}</span><input type="text" class="form-control" id="edit_name" value="${company.name}" style="display:none;"></td></tr><tr><th>RUC</th><td><span id="display_ruc">${company.ruc}</span><input type="text" class="form-control" id="edit_ruc" value="${company.ruc}" style="display:none;"></td></tr><tr><th>Dirección</th><td><span id="display_address">${company.address || '-'}</span><input type="text" class="form-control" id="edit_address" value="${company.address || ''}" style="display:none;"></td></tr><tr><th>Teléfono</th><td><span id="display_phone">${company.phone || '-'}</span><input type="text" class="form-control" id="edit_phone" value="${company.phone || ''}" style="display:none;"></td></tr><tr><th>Email</th><td><span id="display_email">${company.email || '-'}</span><input type="email" class="form-control" id="edit_email" value="${company.email || ''}" style="display:none;"></td></tr><tr><th>Sector</th><td><span id="display_sector">${company.sector || '-'}</span><input type="text" class="form-control" id="edit_sector" value="${company.sector || ''}" style="display:none;"></td></tr></table><div id="editActions" style="display:none;"><button class="btn btn-success" onclick="saveCompany()">Guardar</button><button class="btn btn-secondary" onclick="cancelEdit()">Cancelar</button></div>`; }
        function enableEdit() { document.querySelectorAll('[id^="display_"]').forEach(el => el.style.display = 'none'); document.querySelectorAll('[id^="edit_"]').forEach(el => el.style.display = 'block'); document.querySelector('.btn-primary').style.display = 'none'; document.getElementById('editActions').style.display = 'block'; }
        function cancelEdit() { document.querySelectorAll('[id^="display_"]').forEach(el => el.style.display = 'block'); document.querySelectorAll('[id^="edit_"]').forEach(el => el.style.display = 'none'); document.querySelector('.btn-primary').style.display = 'inline-block'; document.getElementById('editActions').style.display = 'none'; displayCompanyInfo(currentCompany); }
        async function saveCompany() { const updated = { ...currentCompany, name: document.getElementById('edit_name').value, ruc: document.getElementById('edit_ruc').value, address: document.getElementById('edit_address').value, phone: document.getElementById('edit_phone').value, email: document.getElementById('edit_email').value, sector: document.getElementById('edit_sector').value }; try { await CompanyService.update(currentCompany.id, updated); showAlert('Éxito', 'Empresa actualizada', 'success'); cancelEdit(); await loadCompanyData(); } catch(e) { showAlert('Error', 'Error al guardar', 'error'); } }
        document.getElementById('toggleSidebar').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); });
        document.addEventListener('DOMContentLoaded', loadCompanyData);
    </script>
</body>
</html>
