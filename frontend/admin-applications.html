<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Gestionar Postulaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/api.js"></script>
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #1e2a3a; color: white; z-index: 1000; overflow-y: auto; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #3498db; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item { display: block; padding: 12px 20px; color: #ecf0f1; text-decoration: none; transition: 0.3s; }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active { background: #3498db; color: white; }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        .main-content { margin-left: 260px; min-height: 100vh; }
        .navbar { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, #3498db, #2980b9); color: white; }
        .table-container { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .btn-accept { background: #27ae60; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; }
        .btn-reject { background: #e74c3c; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; }
        .btn-pending { background: #f39c12; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; }
        .badge-pending { background: #f39c12; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
        .badge-accepted { background: #27ae60; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
        .badge-rejected { background: #e74c3c; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
        @media (max-width: 768px) { .sidebar { margin-left: -260px; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-graduation-cap"></i> InternSys</h4><small>Admin</small></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-admin.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="admin-applications.html" class="menu-item active"><i class="fas fa-file-signature"></i> Postulaciones</a></li>
            <li><a href="students.html" class="menu-item"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
            <li><a href="offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Ofertas</a></li>
        </ul>
    </div>

    <div class="main-content">
        <nav class="navbar">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h4 text-white">Gestión de Postulaciones</span>
                <button class="btn btn-light" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </nav>
        <div class="container-fluid mt-4">
            <div class="table-container">
                <h5><i class="fas fa-file-signature me-2"></i>Postulaciones de Estudiantes</h5>
                <hr>
                <div class="table-responsive">
                    <table class="table table-striped" id="applicationsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Estudiante</th>
                                <th>Oferta</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="6" class="text-center">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getCurrentUser() {
            const u = localStorage.getItem('internsys_user');
            return u ? JSON.parse(u) : null;
        }

        function cerrarSesion() {
            localStorage.removeItem('internsys_user');
            window.location.href = 'index.html';
        }

        function showAlert(msg, type) {
            Swal.fire({ title: type === 'success' ? 'Éxito' : 'Error', text: msg, icon: type, confirmButtonColor: '#3498db' });
        }

        async function loadApplications() {
            try {
                let applications = [];
                try {
                    const appRes = await ApplicationService.getAll();
                    applications = appRes.result || [];
                } catch(e) {
                    applications = JSON.parse(localStorage.getItem('internsys_applications') || '[]');
                }
                
                const students = await StudentService.getAll();
                const offers = await OfferService.getAll();
                const studentsMap = {};
                const offersMap = {};
                (students.result || []).forEach(s => studentsMap[s.id] = `${s.nombre} ${s.apellido || ''}`);
                (offers.result || []).forEach(o => offersMap[o.id] = o.title || o.titulo);
                
                const tableBody = applications.map(app => `
                    <tr>
                        <td>${app.id}</td>
                        <td>${studentsMap[app.student_id] || `ID: ${app.student_id}`}</td>
                        <td>${offersMap[app.offer_id] || `ID: ${app.offer_id}`}</td>
                        <td>${app.application_date || app.created_at?.split('T')[0] || '-'}</td>
                        <td>
                            <span class="${app.status === 'aceptada' ? 'badge-accepted' : app.status === 'denegada' ? 'badge-rejected' : 'badge-pending'}">
                                ${app.status === 'aceptada' ? 'Aceptada' : app.status === 'denegada' ? 'Denegada' : 'Pendiente'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-accept" onclick="cambiarEstado(${app.id}, 'aceptada')" ${app.status !== 'pendiente' ? 'disabled' : ''}>✓ Aceptar</button>
                            <button class="btn-reject" onclick="cambiarEstado(${app.id}, 'denegada')" ${app.status !== 'pendiente' ? 'disabled' : ''}>✗ Denegar</button>
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('applicationsTable').innerHTML = `
                    <thead><tr><th>ID</th><th>Estudiante</th><th>Oferta</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody>${tableBody || '<tr><td colspan="6" class="text-center">No hay postulaciones</td></tr>'}</tbody>
                `;
            } catch(e) {
                console.error('Error:', e);
            }
        }

        async function cambiarEstado(applicationId, newStatus) {
            const confirm = await Swal.fire({
                title: `¿${newStatus === 'aceptada' ? 'Aceptar' : 'Denegar'} postulación?`,
                text: `Esta acción cambiará el estado de la postulación a ${newStatus === 'aceptada' ? 'Aceptada' : 'Denegada'}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: newStatus === 'aceptada' ? '#27ae60' : '#e74c3c',
                confirmButtonText: 'Sí, confirmar'
            });
            
            if (confirm.isConfirmed) {
                try {
                    if (ApplicationService.update) {
                        await ApplicationService.update(applicationId, { status: newStatus });
                    } else {
                        let apps = JSON.parse(localStorage.getItem('internsys_applications') || '[]');
                        const index = apps.findIndex(a => a.id == applicationId);
                        if (index !== -1) {
                            apps[index].status = newStatus;
                            apps[index].updated_at = new Date().toISOString();
                            localStorage.setItem('internsys_applications', JSON.stringify(apps));
                        }
                    }
                    showAlert(`Postulación ${newStatus === 'aceptada' ? 'aceptada' : 'denegada'} correctamente`, 'success');
                    loadApplications();
                } catch(e) {
                    showAlert('Error al actualizar', 'error');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user || user.rol !== 'admin') { window.location.href = 'index.html'; return; }
            loadApplications();
        });
    </script>
</body>
</html>
