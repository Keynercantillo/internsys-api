<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Notificaciones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/styles.css"></head>
<body><div class="sidebar" id="sidebar"><div class="sidebar-header"><h4><i class="fas fa-graduation-cap"></i> InternSys</h4><small>Admin</small></div><ul class="sidebar-menu"><li><a href="dashboard-admin.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li><li><a href="notifications.html" class="menu-item active"><i class="fas fa-bell"></i> Notificaciones</a></li></ul></div>
<div class="main-content" id="mainContent"><nav class="navbar navbar-dark bg-primary"><div class="container-fluid"><button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button><span class="navbar-brand mb-0 h4">Notificaciones</span><button class="btn btn-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</button></div></nav>
<div class="container-fluid mt-4"><div class="card"><div class="card-header bg-primary text-white"><h5 class="mb-0">Centro de Notificaciones</h5></div><div class="card-body"><div class="table-responsive"><table id="mainTable" class="table table-striped"><thead><tr><th>ID</th><th>Título</th><th>Mensaje</th><th>Tipo</th><th>Fecha</th><th>Leído</th></tr></thead><tbody><tr><td colspan="6" class="text-center">Cargando...</td></tr></tbody></table></div></div></div></div></div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script><script src="js/services/api.js"></script><script src="js/components/alert.js"></script><script src="js/auth.js"></script>
<script>let table; async function init(){ try{ const user=getCurrentUser(); const r=await NotificationService.getAll(); const notis=(r.result||[]).filter(n=>n.user_id===user.id); const data=notis.map(n=>[n.id, n.title, n.message, `<span class="badge bg-${n.type==='info'?'info':n.type==='success'?'success':'warning'}">${n.type}</span>`, n.created_at, n.read?'✅':'❌']); if(table) table.destroy(); table=$('#mainTable').DataTable({ data:data, language:{ url:'//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' } }); } catch(e){ $('#mainTable tbody').html('<tr><td colspan="6" class="text-center text-danger">Error</td></tr>'); } } document.getElementById('toggleSidebar').addEventListener('click',function(){ document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); }); document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
