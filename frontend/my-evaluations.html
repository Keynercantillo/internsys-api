<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Mis Evaluaciones</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        
        .sidebar {
            position: fixed; top: 0; left: 0; width: 260px; height: 100%;
            background: #1e2a3a; color: white; transition: all 0.3s; z-index: 1000;
        }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #1abc9c; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item {
            display: block; padding: 12px 20px; color: #ecf0f1;
            text-decoration: none; transition: 0.3s;
        }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active {
            background: #1abc9c; color: white;
        }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        
        .main-content { margin-left: 260px; transition: 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        
        .navbar { padding: 0.75rem 1.5rem; background: #1abc9c; color: white; }
        .navbar .btn-light { background: white; border: none; border-radius: 8px; padding: 8px 12px; }
        .navbar-brand { font-weight: 600; color: white !important; }
        
        .table-container { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        .score-high { color: #27ae60; font-weight: bold; }
        .score-medium { color: #f39c12; font-weight: bold; }
        .score-low { color: #e74c3c; font-weight: bold; }
        
        @media (max-width: 768px) {
            .sidebar { margin-left: -260px; }
            .sidebar.open { margin-left: 0; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h4><i class="fas fa-graduation-cap"></i> InternSys</h4>
            <small>Estudiante</small>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-student.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Mi Dashboard</a></li>
            <li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li>
            <li><a href="my-assignments.html" class="menu-item"><i class="fas fa-tasks"></i> Mis Asignaciones</a></li>
            <li><a href="my-evaluations.html" class="menu-item active"><i class="fas fa-star"></i> Mis Evaluaciones</a></li>
            <li><a href="offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Ofertas</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar">
            <div class="container-fluid">
                <button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <span class="navbar-brand mb-0 h4">Mis Evaluaciones</span>
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="fas fa-user"></i> <span id="userName">Estudiante</span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="my-profile.html"><i class="fas fa-user-edit"></i> Mi Perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div class="table-container">
                <table id="evaluationsTable" class="table table-striped table-bordered" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Puntaje</th>
                            <th>Comentarios</th>
                            <th>Evaluador</th>
                        </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/api.js"></script>

    <script>
        let evaluationsTable;
        
        function getCurrentUser() {
            const user = localStorage.getItem('internsys_user');
            return user ? JSON.parse(user) : null;
        }
        
        function cerrarSesion() {
            localStorage.removeItem('internsys_user');
            window.location.href = 'index.html';
        }
        
        function showAlert(title, message, type = 'success') {
            Swal.fire({ title, text: message, icon: type, confirmButtonColor: '#1abc9c', timer: 2000 });
        }
        
        function getScoreClass(score) {
            if (score >= 4) return 'score-high';
            if (score >= 3) return 'score-medium';
            return 'score-low';
        }
        
        async function initDataTable() {
            try {
                const user = getCurrentUser();
                if (!user) { window.location.href = 'index.html'; return; }
                
                // Verificar que sea estudiante
                if (user.rol !== 'estudiante') {
                    showAlert('Acceso Denegado', 'Esta página es solo para estudiantes', 'error');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                    return;
                }
                
                // Obtener evaluaciones del estudiante
                const response = await EvaluationService.getByStudent(user.id);
                const evaluations = response.result || [];
                
                console.log('Evaluaciones recibidas:', evaluations);
                console.log('ID del estudiante:', user.id);
                
                if (evaluations.length === 0) {
                    $('#evaluationsTable tbody').html('<tr><td colspan="6" class="text-center">No tienes evaluaciones aún</td></tr>');
                    if (evaluationsTable) evaluationsTable.destroy();
                    return;
                }
                
                const data = evaluations.map(e => [
                    e.id,
                    e.evaluation_date,
                    e.evaluation_type === 'parcial' ? '📝 Parcial' : '🎓 Final',
                    `<span class="${getScoreClass(e.score)}">${e.score} / 5.0</span>`,
                    e.comments || 'Sin comentarios',
                    e.evaluator_name || 'Tutor'
                ]);
                
                if (evaluationsTable) evaluationsTable.destroy();
                
                evaluationsTable = $('#evaluationsTable').DataTable({
                    data: data,
                    columns: [
                        { title: "ID" },
                        { title: "Fecha" },
                        { title: "Tipo" },
                        { title: "Puntaje" },
                        { title: "Comentarios" },
                        { title: "Evaluador" }
                    ],
                    language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                    pageLength: 10,
                    order: [[1, 'desc']]
                });
                
            } catch (error) {
                console.error('Error:', error);
                $('#evaluationsTable tbody').html(`<tr><td colspan="6" class="text-center text-danger">Error al cargar: ${error.message}</td></tr>`);
                showAlert('Error', 'Error al cargar evaluaciones: ' + error.message, 'error');
            }
        }
        
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) document.getElementById('userName').innerText = user.nombre || 'Estudiante';
        }
        
        document.getElementById('toggleSidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('closed');
            document.getElementById('mainContent').classList.toggle('expanded');
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            initDataTable();
        });
    </script>
</body>
</html>
