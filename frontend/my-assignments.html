<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Mis Asignaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <script src="components/main-components.js" type="module"></script>
    <style>
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #1e2a3a; color: white; transition: 0.3s; z-index: 1000; }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #27ae60; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item { display: block; padding: 12px 20px; color: #ecf0f1; text-decoration: none; transition: 0.3s; }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active { background: #27ae60; color: white; }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        .main-content { margin-left: 260px; transition: 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .navbar { padding: 0.75rem 1.5rem; background: #27ae60; color: white; }
        .table-container { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; }
        .progress-bar-custom { height: 20px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
        .progress-fill { background: #27ae60; height: 100%; color: white; text-align: center; font-size: 12px; line-height: 20px; }
        @media (max-width: 768px) { .sidebar { margin-left: -260px; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-graduation-cap"></i> InternSys</h4><small>Estudiante</small></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-student.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Mi Dashboard</a></li>
            <li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li>
            <li><a href="my-assignments.html" class="menu-item active"><i class="fas fa-tasks"></i> Mis Asignaciones</a></li>
            <li><a href="my-evaluations.html" class="menu-item"><i class="fas fa-star"></i> Mis Evaluaciones</a></li>
            <li><a href="offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Ofertas</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar">
            <div class="container-fluid">
                <button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <span class="navbar-brand mb-0 h4">Mis Asignaciones</span>
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown"><i class="fas fa-user"></i> <span id="userName"></span></button>
                    <ul class="dropdown-menu"><li><a class="dropdown-item" href="my-profile.html">Mi Perfil</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li></ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div class="d-flex justify-content-end mb-3">
                <custom-button variant="primary" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refrescar</custom-button>
            </div>
            <div class="table-container">
                <table id="assignmentsTable" class="table table-striped table-bordered" style="width:100%">
                    <thead><tr><th>ID</th><th>Oferta</th><th>Empresa</th><th>Tutor</th><th>Fecha Inicio</th><th>Fecha Fin</th><th>Estado</th><th>Progreso</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/services/api.js"></script>
    
    <script>
        let assignmentsTable;
        function getCurrentUser() { const user = localStorage.getItem('internsys_user'); return user ? JSON.parse(user) : null; }
        function cerrarSesion() { localStorage.removeItem('internsys_user'); window.location.href = 'index.html'; }
        function showAlert(msg, type) { if(window.showAlert) window.showAlert(msg, type); else alert(msg); }
        
        async function initDataTable() {
            const user = getCurrentUser();
            if(!user || user.rol !== 'estudiante') { window.location.href = 'index.html'; return; }
            const assignments = (await AssignmentService.getAll()).result || [];
            const offers = (await OfferService.getAll()).result || [];
            const companies = (await CompanyService.getAll()).result || [];
            const tutors = (await TutorService.getAll()).result || [];
            const companyMap = {}; companies.forEach(c => companyMap[c.id] = c.name);
            const offerMap = {}; offers.forEach(o => offerMap[o.id] = o);
            const tutorMap = {}; tutors.forEach(t => tutorMap[t.id] = `${t.nombre} ${t.apellido}`);
            const myAssignments = assignments.filter(a => a.student_id === user.id);
            const data = myAssignments.map(a => {
                const offer = offerMap[a.internship_offer_id] || {};
                const empresa = companyMap[offer.company_id] || '-';
                const porcentaje = a.total_hours ? Math.round((a.completed_hours || 0) / a.total_hours * 100) : 0;
                return [ a.id, offer.title || '-', empresa, tutorMap[a.tutor_id] || '-', a.start_date || '-', a.end_date || '-', a.status === 'activo' ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-secondary">Finalizado</span>', `<div class="progress-bar-custom"><div class="progress-fill" style="width: ${porcentaje}%">${porcentaje}%</div></div>` ];
            });
            if(assignmentsTable) assignmentsTable.destroy();
            assignmentsTable = $('#assignmentsTable').DataTable({ data, columns: [{ title: "ID" }, { title: "Oferta" }, { title: "Empresa" }, { title: "Tutor" }, { title: "Fecha Inicio" }, { title: "Fecha Fin" }, { title: "Estado" }, { title: "Progreso" }], language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }, pageLength: 10 });
        }
        
        async function refreshData() { await initDataTable(); showAlert('Datos actualizados', 'success'); }
        document.getElementById('toggleSidebar').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); });
        document.addEventListener('DOMContentLoaded', () => { document.getElementById('userName').innerText = getCurrentUser()?.nombre || ''; refreshData(); });
    </script>
</body>
</html>
