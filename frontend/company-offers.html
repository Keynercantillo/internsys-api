<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Mis Ofertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #1e2a3a; color: white; transition: all 0.3s; z-index: 1000; }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #9b59b6; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item { display: block; padding: 12px 20px; color: #ecf0f1; text-decoration: none; transition: 0.3s; }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active { background: #9b59b6; color: white; }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        .main-content { margin-left: 260px; transition: 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .navbar { padding: 0.75rem 1.5rem; background: #9b59b6; color: white; }
        .table-container { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; cursor: pointer; }
        .btn-edit { background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 5px; margin-right: 5px; cursor: pointer; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-refresh { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; margin-left: 10px; cursor: pointer; }
        .badge-active { background: #27ae60; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-occupied { background: #e74c3c; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        @media (max-width: 768px) { .sidebar { margin-left: -260px; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-building"></i> InternSys</h4><small>Empresa</small></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-company.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="company-offers.html" class="menu-item active"><i class="fas fa-briefcase"></i> Mis Ofertas</a></li>
            <li><a href="company-assignments.html" class="menu-item"><i class="fas fa-handshake"></i> Mis Asignaciones</a></li>
            <li><a href="company-applications.html" class="menu-item"><i class="fas fa-file-alt"></i> Postulaciones</a></li>
            <li><a href="company-profile.html" class="menu-item"><i class="fas fa-building"></i> Mi Empresa</a></li>
            <li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar">
            <div class="container-fluid">
                <button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <span class="navbar-brand mb-0 h4">Mis Ofertas</span>
                <button class="btn btn-light" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div><button class="btn-add" onclick="showCreateModal()"><i class="fas fa-plus"></i> Nueva Oferta</button><button class="btn-refresh" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refrescar</button></div>
            <div class="table-container"><table id="offersTable" class="table table-striped table-bordered" style="width:100%"><thead><tr><th>ID</th><th>Título</th><th>Vacantes</th><th>Estado</th><th>Fecha Inicio</th><th>Acciones</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>

    <div class="modal fade" id="offerModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title" id="modalTitle">Nueva Oferta</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="offerForm"><input type="hidden" id="offerId"><div class="mb-3"><label>Título *</label><input type="text" class="form-control" id="title" required></div><div class="mb-3"><label>Descripción</label><textarea class="form-control" id="description" rows="3"></textarea></div><div class="mb-3"><label>Vacantes *</label><input type="number" class="form-control" id="available_positions" required></div><div class="row"><div class="col-md-6"><div class="mb-3"><label>Fecha Inicio</label><input type="date" class="form-control" id="start_date"></div></div><div class="col-md-6"><div class="mb-3"><label>Fecha Fin</label><input type="date" class="form-control" id="end_date"></div></div></div><div class="mb-3"><label>Habilidades Requeridas</label><textarea class="form-control" id="required_skills" rows="2"></textarea></div><div class="mb-3"><label>Requisitos</label><textarea class="form-control" id="requirements" rows="2"></textarea></div><div class="mb-3"><label>Estado</label><select class="form-control" id="status"><option value="disponible">Disponible</option><option value="ocupado">Ocupado</option></select></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" onclick="saveOffer()">Guardar</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/api.js"></script>

    <script>
        let offersTable, currentEditId = null;
        function getCurrentUser() { const user = localStorage.getItem('internsys_user'); return user ? JSON.parse(user) : null; }
        function cerrarSesion() { localStorage.removeItem('internsys_user'); window.location.href = 'index.html'; }
        function showAlert(title, message, type = 'success') { Swal.fire({ title, text: message, icon: type, confirmButtonColor: '#9b59b6', timer: 2000 }); }
        
        async function initDataTable() {
            try {
                const user = getCurrentUser();
                if (!user || user.rol !== 'empresa') { window.location.href = 'index.html'; return; }
                if (!user.empresa_id) { showAlert('Error', 'No se encontró la empresa asociada', 'error'); return; }
                const offers = await OfferService.getAll();
                const misOfertas = (offers.result || []).filter(o => o.company_id === user.empresa_id);
                const data = misOfertas.map(o => [o.id, o.title || '-', o.available_positions || 0, o.status === 'disponible' ? '<span class="badge-active">Disponible</span>' : '<span class="badge-occupied">Ocupado</span>', o.start_date || '-', `<button class="btn-edit" onclick="editOffer(${o.id})"><i class="fas fa-edit"></i> Editar</button> <button class="btn-delete" onclick="deleteOffer(${o.id})"><i class="fas fa-trash"></i> Eliminar</button>`]);
                if (offersTable) offersTable.destroy();
                offersTable = $('#offersTable').DataTable({ data, columns: [{ title: "ID" }, { title: "Título" }, { title: "Vacantes" }, { title: "Estado" }, { title: "Fecha Inicio" }, { title: "Acciones", orderable: false }], language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }, pageLength: 10 });
            } catch(e) { showAlert('Error', 'Error al cargar: ' + e.message, 'error'); }
        }
        
        async function refreshData() { await initDataTable(); showAlert('Actualizado', 'Datos actualizados', 'success'); }
        function showCreateModal() { currentEditId = null; document.getElementById('offerForm').reset(); document.getElementById('modalTitle').innerText = 'Nueva Oferta'; new bootstrap.Modal(document.getElementById('offerModal')).show(); }
        async function editOffer(id) { try { const o = await OfferService.getById(id); currentEditId = id; document.getElementById('title').value = o.title || ''; document.getElementById('description').value = o.description || ''; document.getElementById('available_positions').value = o.available_positions || 0; document.getElementById('start_date').value = o.start_date || ''; document.getElementById('end_date').value = o.end_date || ''; document.getElementById('required_skills').value = o.required_skills || ''; document.getElementById('requirements').value = o.requirements || ''; document.getElementById('status').value = o.status || 'disponible'; document.getElementById('modalTitle').innerText = 'Editar Oferta'; new bootstrap.Modal(document.getElementById('offerModal')).show(); } catch(e) { showAlert('Error', 'Error al cargar', 'error'); } }
        async function saveOffer() { const user = getCurrentUser(); if (!user.empresa_id) { showAlert('Error', 'No se encontró la empresa asociada', 'error'); return; } const data = { title: document.getElementById('title').value, description: document.getElementById('description').value, available_positions: parseInt(document.getElementById('available_positions').value), start_date: document.getElementById('start_date').value || null, end_date: document.getElementById('end_date').value || null, required_skills: document.getElementById('required_skills').value, requirements: document.getElementById('requirements').value, status: document.getElementById('status').value, company_id: user.empresa_id }; if (!data.title) { showAlert('Error', 'El título es obligatorio', 'error'); return; } try { if (currentEditId) { await OfferService.update(currentEditId, data); showAlert('Actualizado', 'Oferta actualizada', 'success'); } else { await OfferService.create(data); showAlert('Creada', 'Oferta creada', 'success'); } bootstrap.Modal.getInstance(document.getElementById('offerModal')).hide(); await initDataTable(); } catch(e) { showAlert('Error', 'Error al guardar: ' + e.message, 'error'); } }
        async function deleteOffer(id) { const result = await Swal.fire({ title: '¿Estás seguro?', text: "No se puede deshacer", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', confirmButtonText: 'Sí, eliminar' }); if (result.isConfirmed) { try { await OfferService.delete(id); showAlert('Eliminada', 'Oferta eliminada', 'success'); await initDataTable(); } catch(e) { showAlert('Error', 'Error al eliminar', 'error'); } } }
        
        document.getElementById('toggleSidebar').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); });
        document.addEventListener('DOMContentLoaded', () => { initDataTable(); });
    </script>
</body>
</html>
