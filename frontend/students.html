<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #1e2a3a; color: white; transition: all 0.3s; z-index: 1000; overflow-y: auto; }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #3498db; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item { display: block; padding: 12px 20px; color: #ecf0f1; text-decoration: none; transition: 0.3s; }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active { background: #3498db; color: white; }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        .main-content { margin-left: 260px; transition: 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .navbar { padding: 0.75rem 1.5rem; background: #3498db; color: white; }
        .navbar .btn-light { background: white; border: none; border-radius: 8px; padding: 8px 12px; }
        .navbar-brand { font-weight: 600; color: white !important; }
        .table-container { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; cursor: pointer; }
        .btn-edit { background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 5px; margin-right: 5px; cursor: pointer; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-refresh { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; margin-left: 10px; cursor: pointer; }
        .modal-header.bg-primary { background: #3498db !important; }
        @media (max-width: 768px) { .sidebar { margin-left: -260px; } .sidebar.open { margin-left: 0; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-graduation-cap"></i> InternSys</h4><small id="roleLabel">Cargando...</small></div>
        <ul class="sidebar-menu" id="sidebarMenu"></ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar"><div class="container-fluid"><button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button><span class="navbar-brand mb-0 h4">Gestión de Estudiantes</span><div class="dropdown"><button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown"><i class="fas fa-user"></i> <span id="userName">Usuario</span></button><ul class="dropdown-menu"><li><a class="dropdown-item" href="my-profile.html"><i class="fas fa-user-edit"></i> Mi Perfil</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li></ul></div></div></nav>

        <div class="container-fluid mt-4">
            <div><button class="btn-add" id="btnAdd" style="display:none;" onclick="showCreateModal()"><i class="fas fa-plus"></i> Nuevo Estudiante</button><button class="btn-refresh" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refrescar</button></div>
            <div class="table-container"><table id="studentsTable" class="table table-striped table-bordered" style="width:100%"><thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Cédula</th><th>Edad</th><th>Matrícula</th><th>Carrera</th><th>Semestre</th><th>Promedio</th><th>Acciones</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>

    <div class="modal fade" id="studentModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-primary"><h5 class="modal-title" id="modalTitle">Nuevo Estudiante</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="studentForm"><input type="hidden" id="studentId"><div class="row"><div class="col-md-6"><div class="mb-3"><label>Nombre *</label><input type="text" class="form-control" id="nombre" required></div></div><div class="col-md-6"><div class="mb-3"><label>Apellido *</label><input type="text" class="form-control" id="apellido" required></div></div><div class="col-md-6"><div class="mb-3"><label>Cédula *</label><input type="text" class="form-control" id="cedula" required></div></div><div class="col-md-6"><div class="mb-3"><label>Edad *</label><input type="number" class="form-control" id="edad" required></div></div><div class="col-md-6"><div class="mb-3"><label>Usuario *</label><input type="text" class="form-control" id="usuario" required></div></div><div class="col-md-6"><div class="mb-3"><label>Contraseña *</label><input type="password" class="form-control" id="contraseña" required></div></div><div class="col-md-6"><div class="mb-3"><label>Matrícula *</label><input type="text" class="form-control" id="matricula" required></div></div><div class="col-md-6"><div class="mb-3"><label>Carrera *</label><select class="form-control" id="carrera" required><option value="">Seleccione...</option><option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option><option value="Ingeniería Civil">Ingeniería Civil</option><option value="Administración">Administración</option><option value="Contaduría">Contaduría</option></select></div></div><div class="col-md-6"><div class="mb-3"><label>Semestre</label><input type="number" class="form-control" id="semester" value="1"></div></div><div class="col-md-6"><div class="mb-3"><label>Promedio</label><input type="number" step="0.01" class="form-control" id="promedio"></div></div></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" onclick="saveStudent()">Guardar</button></div></div></div></div>

    <div class="modal fade" id="viewStudentModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-info text-white"><h5 class="modal-title">Detalles del Estudiante</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="viewStudentContent"></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/api.js"></script>

    <script>
        let studentsTable, currentEditId = null;

        function getCurrentUser() { const user = localStorage.getItem('internsys_user'); return user ? JSON.parse(user) : null; }
        function getRole() { const user = getCurrentUser(); return user ? user.rol : null; }
        function isAdmin() { return getRole() === 'admin'; }
        function cerrarSesion() { localStorage.removeItem('internsys_user'); window.location.href = 'index.html'; }
        
        function showAlert(title, message, type = 'success') {
            Swal.fire({ title, text: message, icon: type, confirmButtonColor: '#3498db', timer: 2000 });
        }

        function loadSidebarMenu() {
            const user = getCurrentUser();
            const menu = document.getElementById('sidebarMenu');
            const roleLabel = document.getElementById('roleLabel');
            const userNameSpan = document.getElementById('userName');
            if (!user) return;
            roleLabel.innerText = user.rol === 'admin' ? 'Administrador' : user.rol === 'estudiante' ? 'Estudiante' : 'Tutor';
            userNameSpan.innerText = user.nombre || 'Usuario';
            
            if (user.rol === 'admin') {
                document.getElementById('btnAdd').style.display = 'inline-block';
                menu.innerHTML = `<li><a href="dashboard-admin.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li><li><a href="students.html" class="menu-item active"><i class="fas fa-user-graduate"></i> Estudiantes</a></li><li><a href="companies.html" class="menu-item"><i class="fas fa-building"></i> Empresas</a></li><li><a href="tutors.html" class="menu-item"><i class="fas fa-chalkboard-user"></i> Tutores</a></li><li><a href="offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Ofertas</a></li><li><a href="assignments.html" class="menu-item"><i class="fas fa-handshake"></i> Asignaciones</a></li><li><a href="users.html" class="menu-item"><i class="fas fa-users"></i> Usuarios</a></li>`;
            } else if (user.rol === 'estudiante') {
                document.getElementById('btnAdd').style.display = 'none';
                menu.innerHTML = `<li><a href="dashboard-student.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Mi Dashboard</a></li><li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li><li><a href="my-assignments.html" class="menu-item"><i class="fas fa-tasks"></i> Mis Asignaciones</a></li><li><a href="my-evaluations.html" class="menu-item"><i class="fas fa-star"></i> Mis Evaluaciones</a></li><li><a href="offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Ofertas</a></li>`;
            } else {
                document.getElementById('btnAdd').style.display = 'none';
                menu.innerHTML = `<li><a href="dashboard-tutor.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li><li><a href="my-students.html" class="menu-item"><i class="fas fa-users"></i> Mis Estudiantes</a></li><li><a href="evaluations.html" class="menu-item"><i class="fas fa-star"></i> Evaluaciones</a></li><li><a href="followup.html" class="menu-item"><i class="fas fa-calendar-check"></i> Visitas</a></li><li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li>`;
            }
        }

        async function initDataTable() {
            try {
                const user = getCurrentUser();
                if (!user) return;
                
                const response = await StudentService.getAll();
                const students = response.result || [];
                
                let columns = [{ title: "ID" }, { title: "Nombre" }, { title: "Apellido" }, { title: "Cédula" }, { title: "Edad" }, { title: "Matrícula" }, { title: "Carrera" }, { title: "Semestre" }, { title: "Promedio" }];
                if (isAdmin()) columns.push({ title: "Acciones", orderable: false });
                
                const data = [];
                for (let student of students) {
                    const row = [student.id, student.nombre, student.apellido, student.cedula, student.edad, student.matricula, student.carrera, student.semester, student.promedio ? student.promedio.toFixed(2) : 'N/A'];
                    if (isAdmin()) row.push(`<button class="btn-edit" onclick="editStudent(${student.id})"><i class="fas fa-edit"></i> Editar</button><button class="btn-delete" onclick="deleteStudent(${student.id})"><i class="fas fa-trash"></i> Eliminar</button>`);
                    data.push(row);
                }
                
                if (studentsTable) studentsTable.destroy();
                studentsTable = $('#studentsTable').DataTable({ data: data, columns: columns, language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }, pageLength: 10, order: [[0, 'desc']] });
            } catch (error) { showAlert('Error', 'Error al cargar: ' + error.message, 'error'); }
        }

        async function refreshData() { await initDataTable(); showAlert('Actualizado', 'Datos actualizados', 'success'); }

        function showCreateModal() { if (!isAdmin()) { showAlert('Acceso Denegado', 'No tienes permisos', 'error'); return; } currentEditId = null; document.getElementById('studentForm').reset(); document.getElementById('modalTitle').innerText = 'Nuevo Estudiante'; new bootstrap.Modal(document.getElementById('studentModal')).show(); }
        
        async function editStudent(id) { if (!isAdmin()) { showAlert('Acceso Denegado', 'No tienes permisos', 'error'); return; } try { const s = await StudentService.getById(id); currentEditId = id; document.getElementById('nombre').value = s.nombre; document.getElementById('apellido').value = s.apellido; document.getElementById('cedula').value = s.cedula; document.getElementById('edad').value = s.edad; document.getElementById('usuario').value = s.usuario; document.getElementById('matricula').value = s.matricula; document.getElementById('carrera').value = s.carrera; document.getElementById('semester').value = s.semester; document.getElementById('promedio').value = s.promedio; document.getElementById('modalTitle').innerText = 'Editar Estudiante'; new bootstrap.Modal(document.getElementById('studentModal')).show(); } catch (error) { showAlert('Error', 'Error al cargar', 'error'); } }
        
        async function saveStudent() { if (!isAdmin()) { showAlert('Acceso Denegado', 'No tienes permisos', 'error'); return; } const data = { nombre: document.getElementById('nombre').value, apellido: document.getElementById('apellido').value, cedula: document.getElementById('cedula').value, edad: parseInt(document.getElementById('edad').value), usuario: document.getElementById('usuario').value, contraseña: document.getElementById('contraseña').value, matricula: document.getElementById('matricula').value, carrera: document.getElementById('carrera').value, semester: parseInt(document.getElementById('semester').value), promedio: parseFloat(document.getElementById('promedio').value) || null }; try { if (currentEditId) { await StudentService.update(currentEditId, data); showAlert('Actualizado', 'Estudiante actualizado', 'success'); } else { await StudentService.create(data); showAlert('Creado', 'Estudiante creado', 'success'); } bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide(); await initDataTable(); } catch (error) { showAlert('Error', 'Error al guardar: ' + error.message, 'error'); } }
        
        async function deleteStudent(id) { if (!isAdmin()) { showAlert('Acceso Denegado', 'No tienes permisos', 'error'); return; } const result = await Swal.fire({ title: '¿Estás seguro?', text: "No se puede deshacer", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', confirmButtonText: 'Sí, eliminar' }); if (result.isConfirmed) { try { await StudentService.delete(id); showAlert('Eliminado', 'Estudiante eliminado', 'success'); await initDataTable(); } catch (error) { showAlert('Error', 'Error al eliminar', 'error'); } } }
        
        document.getElementById('toggleSidebar').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); });
        document.addEventListener('DOMContentLoaded', () => { loadSidebarMenu(); initDataTable(); });
    </script>
</body>
</html>
