<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Mis Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-graduation-cap"></i> InternSys</h4><small id="userRoleText">Tutor</small></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-tutor.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="my-students.html" class="menu-item active"><i class="fas fa-users"></i> Mis Estudiantes</a></li>
            <li><a href="evaluations.html" class="menu-item"><i class="fas fa-star"></i> Evaluaciones</a></li>
            <li><a href="followup.html" class="menu-item"><i class="fas fa-calendar-check"></i> Visitas</a></li>
            <li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid">
                <button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <span class="navbar-brand mb-0 h4">Mis Estudiantes</span>
                <button class="btn btn-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div class="card"><div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="fas fa-users me-2"></i>Estudiantes Asignados</h5></div>
            <div class="card-body"><div class="table-responsive"><table id="studentsTable" class="table table-striped table-bordered"><thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Carrera</th><th>Semestre</th><th>Progreso</th><th>Acciones</th></tr></thead><tbody></tbody></table></div></div></div>
        </div>
    </div>

    <div class="modal fade" id="evaluateModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title">Evaluar Estudiante</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="evaluateForm"><input type="hidden" id="evalStudentId"><div class="mb-3"><label>Tipo Evaluación</label><select class="form-control" id="eval_type"><option value="parcial">Parcial</option><option value="final">Final</option></select></div><div class="mb-3"><label>Puntaje (0-5)</label><input type="number" step="0.1" class="form-control" id="eval_score" required></div><div class="mb-3"><label>Comentarios</label><textarea class="form-control" id="eval_comments" rows="3"></textarea></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" onclick="saveEvaluation()">Guardar Evaluación</button></div></div></div></div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/components/alert.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let studentsTable, currentStudentId=null;
        async function initTable(){
            try{
                const user=getCurrentUser();
                const r=await StudentService.getAll();
                const students=r.result||[];
                const myStudents=students.filter(s=>s.tutor_id===user.id);
                const data=myStudents.map(s=>[s.id, s.nombre, s.apellido, s.carrera, s.semester, `<div class="progress"><div class="progress-bar bg-success" style="width:${s.progreso||0}%">${s.progreso||0}%</div></div>`, `<button class="btn btn-sm btn-info me-1" onclick="viewStudent(${s.id})"><i class="fas fa-eye"></i></button><button class="btn btn-sm btn-primary" onclick="showEvaluateModal(${s.id})"><i class="fas fa-star"></i> Evaluar</button>`]);
                if(studentsTable) studentsTable.destroy();
                studentsTable=$('#studentsTable').DataTable({ data:data, language:{ url:'//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' } });
            } catch(e){ AlertComponent.error('Error'); }
        }
        function viewStudent(id){ AlertComponent.info('Viendo detalles del estudiante'); }
        function showEvaluateModal(id){ currentStudentId=id; document.getElementById('evaluateForm').reset(); new bootstrap.Modal(document.getElementById('evaluateModal')).show(); }
        async function saveEvaluation(){ const data={ student_id:currentStudentId, evaluation_type:document.getElementById('eval_type').value, score:parseFloat(document.getElementById('eval_score').value), comments:document.getElementById('eval_comments').value, evaluation_date:new Date().toISOString().split('T')[0] }; try{ await EvaluationService.create(data); AlertComponent.success('Evaluación guardada'); bootstrap.Modal.getInstance(document.getElementById('evaluateModal')).hide(); } catch(e){ AlertComponent.error('Error'); } }
        document.getElementById('toggleSidebar').addEventListener('click',function(){ document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); });
        document.addEventListener('DOMContentLoaded',()=>{ initTable(); });
    </script>
</body>
</html>
