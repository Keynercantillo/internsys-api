<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Mis Asignaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #1e2a3a; color: white; transition: all 0.3s; z-index: 1000; }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #9b59b6; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item { display: block; padding: 12px 20px; color: #ecf0f1; text-decoration: none; transition: 0.3s; }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active { background: #9b59b6; color: white; }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        .main-content { margin-left: 260px; transition: 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .navbar { padding: 0.75rem 1.5rem; background: #9b59b6; color: white; }
        .table-container { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .btn-refresh { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; cursor: pointer; }
        @media (max-width: 768px) { .sidebar { margin-left: -260px; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-building"></i> InternSys</h4><small>Empresa</small></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-company.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="company-offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Mis Ofertas</a></li>
            <li><a href="company-assignments.html" class="menu-item active"><i class="fas fa-handshake"></i> Mis Asignaciones</a></li>
            <li><a href="company-applications.html" class="menu-item"><i class="fas fa-file-alt"></i> Postulaciones</a></li>
            <li><a href="company-profile.html" class="menu-item"><i class="fas fa-building"></i> Mi Empresa</a></li>
            <li><a href="my-profile.html" class="menu-item"><i class="fas fa-user"></i> Mi Perfil</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar">
            <div class="container-fluid">
                <button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <span class="navbar-brand mb-0 h4">Mis Asignaciones</span>
                <button class="btn btn-light" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div class="text-end mb-3"><button class="btn-refresh" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refrescar</button></div>
            <div class="table-container"><table id="assignmentsTable" class="table table-striped table-bordered" style="width:100%"><thead><tr><th>ID</th><th>Estudiante</th><th>Oferta</th><th>Tutor</th><th>Fecha Inicio</th><th>Estado</th><th>Horas</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/api.js"></script>

    <script>
        let assignmentsTable;
        function getCurrentUser() { const user = localStorage.getItem('internsys_user'); return user ? JSON.parse(user) : null; }
        function cerrarSesion() { localStorage.removeItem('internsys_user'); window.location.href = 'index.html'; }
        function showAlert(title, message, type = 'success') { Swal.fire({ title, text: message, icon: type, confirmButtonColor: '#9b59b6', timer: 2000 }); }
        
        async function initDataTable() {
            try {
                const user = getCurrentUser();
                if (!user || user.rol !== 'empresa') { window.location.href = 'index.html'; return; }
                if (!user.empresa_id) { showAlert('Error', 'No se encontró la empresa asociada', 'error'); return; }
                const [assignments, offers, students, tutors] = await Promise.all([AssignmentService.getAll(), OfferService.getAll(), StudentService.getAll(), TutorService.getAll()]);
                const offerMap = {}; (offers.result || []).forEach(o => offerMap[o.id] = o);
                const studentMap = {}; (students.result || []).forEach(s => studentMap[s.id] = `${s.nombre} ${s.apellido}`);
                const tutorMap = {}; (tutors.result || []).forEach(t => tutorMap[t.id] = `${t.nombre} ${t.apellido}`);
                const misAsignaciones = (assignments.result || []).filter(a => { const offer = offerMap[a.internship_offer_id]; return offer && offer.company_id === user.empresa_id; });
                const data = misAsignaciones.map(a => [a.id, studentMap[a.student_id] || '-', offerMap[a.internship_offer_id]?.title || '-', tutorMap[a.tutor_id] || '-', a.start_date || '-', `<span class="badge bg-${a.status === 'activo' ? 'success' : 'secondary'}">${a.status || a.estado}</span>`, `${a.completed_hours || 0}/${a.total_hours || 0}`]);
                if (assignmentsTable) assignmentsTable.destroy();
                assignmentsTable = $('#assignmentsTable').DataTable({ data, columns: [{ title: "ID" }, { title: "Estudiante" }, { title: "Oferta" }, { title: "Tutor" }, { title: "Fecha Inicio" }, { title: "Estado" }, { title: "Horas" }], language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' } });
            } catch(e) { showAlert('Error', 'Error al cargar: ' + e.message, 'error'); }
        }
        
        async function refreshData() { await initDataTable(); showAlert('Actualizado', 'Datos actualizados', 'success'); }
        document.getElementById('toggleSidebar').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); });
        document.addEventListener('DOMContentLoaded', initDataTable);
    </script>
</body>
</html>
