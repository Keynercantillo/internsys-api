<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Reportes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/styles.css"></head>
<body><div class="sidebar" id="sidebar"><div class="sidebar-header"><h4><i class="fas fa-graduation-cap"></i> InternSys</h4><small>Admin</small></div><ul class="sidebar-menu"><li><a href="dashboard-admin.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li><li><a href="reports.html" class="menu-item active"><i class="fas fa-chart-line"></i> Reportes</a></li></ul></div>
<div class="main-content" id="mainContent"><nav class="navbar navbar-dark bg-primary"><div class="container-fluid"><button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button><span class="navbar-brand mb-0 h4">Reportes</span><button class="btn btn-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</button></div></nav>
<div class="container-fluid mt-4"><div class="row"><div class="col-md-6 mb-4"><div class="card"><div class="card-header bg-primary text-white"><h5 class="mb-0">Reporte de Estudiantes</h5></div><div class="card-body"><canvas id="studentsChart"></canvas><button class="btn btn-primary mt-3 w-100" onclick="generateReport('students')"><i class="fas fa-download"></i> Generar Reporte</button></div></div></div>
<div class="col-md-6 mb-4"><div class="card"><div class="card-header bg-success text-white"><h5 class="mb-0">Reporte de Asignaciones</h5></div><div class="card-body"><canvas id="assignmentsChart"></canvas><button class="btn btn-success mt-3 w-100" onclick="generateReport('assignments')"><i class="fas fa-download"></i> Generar Reporte</button></div></div></div></div></div></div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="js/services/api.js"></script><script src="js/components/alert.js"></script><script src="js/auth.js"></script>
<script>let studentsChart, assignmentsChart; async function loadCharts(){ try{ const students=await StudentService.getAll(); const assignments=await AssignmentService.getAll(); const carreras={}; (students.result||[]).forEach(s=>carreras[s.carrera]=(carreras[s.carrera]||0)+1); if(studentsChart) studentsChart.destroy(); studentsChart=new Chart(document.getElementById('studentsChart'),{ type:'bar', data:{ labels:Object.keys(carreras), datasets:[{ label:'Estudiantes por Carrera', data:Object.values(carreras), backgroundColor:'#3498db' }] } }); const estados={ activo:0, finalizado:0, cancelado:0 }; (assignments.result||[]).forEach(a=>estados[a.estado]=(estados[a.estado]||0)+1); if(assignmentsChart) assignmentsChart.destroy(); assignmentsChart=new Chart(document.getElementById('assignmentsChart'),{ type:'pie', data:{ labels:['Activo','Finalizado','Cancelado'], datasets:[{ data:[estados.activo,estados.finalizado,estados.cancelado], backgroundColor:['#27ae60','#3498db','#e74c3c'] }] } }); } catch(e){ AlertComponent.error('Error al cargar gráficos'); } } function generateReport(type){ AlertComponent.success(`Reporte de ${type} generado`); } document.getElementById('toggleSidebar').addEventListener('click',function(){ document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); }); document.addEventListener('DOMContentLoaded',loadCharts);</script>
</body></html>
