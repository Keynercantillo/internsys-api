<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Iniciar Sesión</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            animation: fadeInUp 0.5s ease;
            overflow: hidden;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .login-header i {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .login-header h2 {
            margin: 0;
            font-weight: 600;
        }
        
        .login-header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
            color: #333;
        }
        
        .form-group label i {
            margin-right: 8px;
            color: #667eea;
        }
        
        .form-control {
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
            outline: none;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #ddd;
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .divider span {
            background: white;
            padding: 0 10px;
            color: #999;
            font-size: 12px;
        }
        
        .test-users {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .test-users h6 {
            text-align: center;
            margin-bottom: 10px;
            color: #666;
        }
        
        .test-user-item {
            font-size: 12px;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .test-user-item:hover {
            background: #e9ecef;
        }
        
        .test-user-item i {
            width: 20px;
            margin-right: 5px;
        }
        
        .text-primary { color: #667eea !important; }
        .text-success { color: #27ae60 !important; }
        .text-warning { color: #f39c12 !important; }
        .text-info { color: #3498db !important; }
        
        .alert-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            min-width: 300px;
            z-index: 9999;
            animation: slideInRight 0.3s ease;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-graduation-cap"></i>
            <h2>InternSys</h2>
            <p>Sistema de Gestión de Pasantías</p>
        </div>
        
        <div class="login-body">
            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="ejemplo@universidad.edu" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
                </button>
            </form>
            
            <div class="divider">
                <span>Usuarios de prueba</span>
            </div>
            
            <div class="test-users">
                <div class="test-user-item" onclick="fillCredentials('admin@internsys.com', 'admin123')">
                    <i class="fas fa-user-shield text-primary"></i>
                    <strong>Admin:</strong> admin@internsys.com / admin123
                </div>
                <div class="test-user-item" onclick="fillCredentials('estudiante@universidad.edu', 'estudiante123')">
                    <i class="fas fa-user-graduate text-success"></i>
                    <strong>Estudiante:</strong> estudiante@universidad.edu / estudiante123
                </div>
                <div class="test-user-item" onclick="fillCredentials('tutor@empresa.com', 'tutor123')">
                    <i class="fas fa-chalkboard-user text-warning"></i>
                    <strong>Tutor:</strong> tutor@empresa.com / tutor123
                </div>
                <div class="test-user-item" onclick="fillCredentials('profesor@universidad.edu', 'profesor123')">
                    <i class="fas fa-chalkboard-user text-info"></i>
                    <strong>Docente:</strong> profesor@universidad.edu / profesor123
                </div>
                <div class="test-user-item" onclick="fillCredentials('empresa@techsolutions.com', 'empresa123')">
                    <i class="fas fa-building text-primary"></i>
                    <strong>Empresa:</strong> empresa@techsolutions.com / empresa123
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // Función para llenar credenciales de prueba
        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            
            // Mostrar alerta
            Swal.fire({
                title: 'Credenciales cargadas',
                text: `Email: ${email}`,
                icon: 'info',
                timer: 1500,
                showConfirmButton: false
            });
        }
        
        // Función para mostrar alertas
        function showAlert(message, type = 'success') {
            Swal.fire({
                title: type === 'success' ? 'Éxito' : type === 'error' ? 'Error' : 'Información',
                text: message,
                icon: type,
                confirmButtonColor: '#667eea',
                timer: 2000,
                timerProgressBar: true
            });
        }
        
        // Configuración de API
        const API_URL = 'http://127.0.0.1:8000/api';
        
        // Función de login
        async function login(email, password) {
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const user = data.result;
                    
                    const userData = {
                        id: user.id,
                        nombre: user.nombre,
                        apellido: user.apellido,
                        cedula: user.cedula,
                        edad: user.edad,
                        usuario: user.usuario,
                        email: user.email,
                        rol: user.rol,
                        dashboard: getDashboardByRole(user.rol)
                    };
                    
                    localStorage.setItem('internsys_user', JSON.stringify(userData));
                    showAlert(`Bienvenido ${user.nombre} ${user.apellido}`, 'success');
                    
                    setTimeout(() => {
                        window.location.href = userData.dashboard;
                    }, 1000);
                    
                    return { success: true };
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Credenciales incorrectas', 'error');
                    return { success: false };
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Error de conexión con el servidor', 'error');
                return { success: false };
            }
        }
        
        function getDashboardByRole(rol) {
            const dashboards = {
                'admin': 'dashboard-admin.html',
                'estudiante': 'dashboard-student.html',
                'tutor': 'dashboard-tutor.html',
                'docente': 'dashboard-tutor.html',
                'empresa': 'dashboard-company.html'
            };
            return dashboards[rol] || 'dashboard-student.html';
        }
        
        // Event listener para el formulario
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await login(email, password);
        });
    </script>
</body>
</html>
