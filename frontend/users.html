<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternSys - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100%; background: #1e2a3a; color: white; transition: all 0.3s; z-index: 1000; }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-header h4 i { margin-right: 10px; color: #3498db; }
        .sidebar-menu { list-style: none; padding: 0; margin-top: 20px; }
        .sidebar-menu .menu-item { display: block; padding: 12px 20px; color: #ecf0f1; text-decoration: none; transition: 0.3s; }
        .sidebar-menu .menu-item:hover, .sidebar-menu .menu-item.active { background: #3498db; color: white; }
        .sidebar-menu .menu-item i { width: 25px; margin-right: 10px; }
        .main-content { margin-left: 260px; transition: 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .navbar { padding: 0.75rem 1.5rem; background: #3498db; color: white; }
        .table-container { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; cursor: pointer; }
        .btn-edit { background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 5px; margin-right: 5px; cursor: pointer; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-refresh { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; margin-left: 10px; cursor: pointer; }
        .badge-admin { background: #e74c3c; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-estudiante { background: #27ae60; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-tutor { background: #f39c12; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-docente { background: #3498db; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-empresa { background: #9b59b6; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        @media (max-width: 768px) { .sidebar { margin-left: -260px; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h4><i class="fas fa-graduation-cap"></i> InternSys</h4><small>Administrador</small></div>
        <ul class="sidebar-menu">
            <li><a href="dashboard-admin.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="students.html" class="menu-item"><i class="fas fa-user-graduate"></i> Estudiantes</a></li>
            <li><a href="companies.html" class="menu-item"><i class="fas fa-building"></i> Empresas</a></li>
            <li><a href="tutors.html" class="menu-item"><i class="fas fa-chalkboard-user"></i> Tutores</a></li>
            <li><a href="offers.html" class="menu-item"><i class="fas fa-briefcase"></i> Ofertas</a></li>
            <li><a href="assignments.html" class="menu-item"><i class="fas fa-handshake"></i> Asignaciones</a></li>
            <li><a href="users.html" class="menu-item active"><i class="fas fa-users"></i> Usuarios</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar">
            <div class="container-fluid">
                <button class="btn btn-light" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <span class="navbar-brand mb-0 h4">Gestión de Usuarios</span>
                <button class="btn btn-light" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div>
                <button class="btn-add" onclick="showCreateModal()"><i class="fas fa-plus"></i> Nuevo Usuario</button>
                <button class="btn-refresh" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refrescar</button>
            </div>
            <div class="table-container">
                <table id="usersTable" class="table table-striped table-bordered" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Empresa</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Crear/Editar Usuario -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="row">
                            <div class="col-md-6"><div class="mb-3"><label>Nombre *</label><input type="text" class="form-control" id="nombre" required></div></div>
                            <div class="col-md-6"><div class="mb-3"><label>Apellido *</label><input type="text" class="form-control" id="apellido" required></div></div>
                            <div class="col-md-6"><div class="mb-3"><label>Cédula *</label><input type="text" class="form-control" id="cedula" required></div></div>
                            <div class="col-md-6"><div class="mb-3"><label>Edad *</label><input type="number" class="form-control" id="edad" required></div></div>
                            <div class="col-md-6"><div class="mb-3"><label>Email *</label><input type="email" class="form-control" id="email" required></div></div>
                            <div class="col-md-6"><div class="mb-3"><label>Usuario *</label><input type="text" class="form-control" id="usuario" required></div></div>
                            <div class="col-md-6"><div class="mb-3"><label>Contraseña *</label><input type="password" class="form-control" id="contraseña" required></div></div>
                            <div class="col-md-6"><div class="mb-3"><label>Rol *</label><select class="form-control" id="rol" required onchange="toggleCamposExtras()"><option value="admin">Administrador</option><option value="estudiante">Estudiante</option><option value="tutor">Tutor</option><option value="docente">Docente</option><option value="empresa">Empresa</option></select></div></div>
                            
                            <!-- Campos para Empresa -->
                            <div class="col-md-12" id="empresaField" style="display: none;">
                                <div class="mb-3">
                                    <label>Empresa Asociada *</label>
                                    <select class="form-control" id="empresa_id">
                                        <option value="">Seleccione una empresa...</option>
                                    </select>
                                    <small class="text-muted">Solo para usuarios con rol "Empresa"</small>
                                </div>
                            </div>
                            
                            <!-- Campos para Tutor/Docente -->
                            <div class="col-md-12" id="tutorField" style="display: none;">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label>Teléfono</label>
                                            <input type="text" class="form-control" id="telefono">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label>Especialidad</label>
                                            <input type="text" class="form-control" id="especialidad">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6"><div class="mb-3"><label>Estado</label><select class="form-control" id="is_active"><option value="true">Activo</option><option value="false">Inactivo</option></select></div></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/api.js"></script>

    <script>
        let usersTable, currentEditId = null, empresasList = [];

        function getCurrentUser() { const user = localStorage.getItem('internsys_user'); return user ? JSON.parse(user) : null; }
        function cerrarSesion() { localStorage.removeItem('internsys_user'); window.location.href = 'index.html'; }
        function showAlert(title, message, type = 'success') { Swal.fire({ title, text: message, icon: type, confirmButtonColor: '#3498db', timer: 2000 }); }

        function getRoleBadge(rol) {
            const badges = { 'admin': '<span class="badge-admin">Administrador</span>', 'estudiante': '<span class="badge-estudiante">Estudiante</span>', 'tutor': '<span class="badge-tutor">Tutor</span>', 'docente': '<span class="badge-docente">Docente</span>', 'empresa': '<span class="badge-empresa">Empresa</span>' };
            return badges[rol] || '<span class="badge-secondary">' + rol + '</span>';
        }

        function toggleCamposExtras() {
            const rol = document.getElementById('rol').value;
            const empresaField = document.getElementById('empresaField');
            const tutorField = document.getElementById('tutorField');
            
            empresaField.style.display = 'none';
            tutorField.style.display = 'none';
            
            if (rol === 'empresa') {
                empresaField.style.display = 'block';
            } else if (rol === 'tutor' || rol === 'docente') {
                tutorField.style.display = 'block';
            }
        }

        async function loadEmpresas() {
            try {
                const response = await CompanyService.getAll();
                empresasList = response.result || [];
                const select = document.getElementById('empresa_id');
                select.innerHTML = '<option value="">Seleccione una empresa...</option>';
                empresasList.forEach(emp => { select.innerHTML += `<option value="${emp.id}">${emp.name} (RUC: ${emp.ruc})</option>`; });
            } catch (error) { console.error('Error loading empresas:', error); }
        }

        async function initDataTable() {
            try {
                const user = getCurrentUser();
                if (!user || user.rol !== 'admin') { window.location.href = 'index.html'; return; }
                const response = await UserService.getAll();
                const users = response.result || [];
                const empresas = await CompanyService.getAll();
                const empresaMap = {};
                (empresas.result || []).forEach(e => empresaMap[e.id] = e.name);
                
                const data = users.map(u => [
                    u.id, u.nombre, u.apellido, u.email, u.usuario, getRoleBadge(u.rol),
                    u.rol === 'empresa' ? (empresaMap[u.empresa_id] || '<span class="text-danger">Sin empresa</span>') : '-',
                    u.is_active ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-danger">Inactivo</span>',
                    `<button class="btn-edit" onclick="editUser(${u.id})"><i class="fas fa-edit"></i> Editar</button><button class="btn-delete" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i> Eliminar</button>`
                ]);
                if (usersTable) usersTable.destroy();
                usersTable = $('#usersTable').DataTable({ data, columns: [{ title: "ID" }, { title: "Nombre" }, { title: "Apellido" }, { title: "Email" }, { title: "Usuario" }, { title: "Rol" }, { title: "Empresa" }, { title: "Estado" }, { title: "Acciones", orderable: false }], language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }, pageLength: 10, order: [[0, 'desc']] });
            } catch (error) { showAlert('Error', 'Error al cargar usuarios: ' + error.message, 'error'); }
        }

        async function refreshData() { await initDataTable(); showAlert('Actualizado', 'Datos actualizados', 'success'); }
        
        function showCreateModal() { 
            currentEditId = null; 
            document.getElementById('userForm').reset(); 
            document.getElementById('modalTitle').innerText = 'Nuevo Usuario'; 
            document.getElementById('empresaField').style.display = 'none';
            document.getElementById('tutorField').style.display = 'none';
            loadEmpresas(); 
            new bootstrap.Modal(document.getElementById('userModal')).show(); 
        }
        
        async function editUser(id) {
            try {
                const user = await UserService.getById(id);
                currentEditId = id;
                await loadEmpresas();
                document.getElementById('nombre').value = user.nombre; 
                document.getElementById('apellido').value = user.apellido;
                document.getElementById('cedula').value = user.cedula; 
                document.getElementById('edad').value = user.edad;
                document.getElementById('email').value = user.email; 
                document.getElementById('usuario').value = user.usuario;
                document.getElementById('rol').value = user.rol; 
                document.getElementById('is_active').value = user.is_active ? 'true' : 'false';
                
                // Limpiar campos extras
                document.getElementById('telefono').value = '';
                document.getElementById('especialidad').value = '';
                
                if (user.rol === 'empresa') {
                    document.getElementById('empresaField').style.display = 'block';
                    document.getElementById('empresa_id').value = user.empresa_id || '';
                } else {
                    document.getElementById('empresaField').style.display = 'none';
                }
                
                if (user.rol === 'tutor' || user.rol === 'docente') {
                    document.getElementById('tutorField').style.display = 'block';
                    // Si tienes datos del tutor, puedes cargarlos aquí
                } else {
                    document.getElementById('tutorField').style.display = 'none';
                }
                
                document.getElementById('modalTitle').innerText = 'Editar Usuario';
                new bootstrap.Modal(document.getElementById('userModal')).show();
            } catch (error) { showAlert('Error', 'Error al cargar usuario: ' + error.message, 'error'); }
        }
        
        async function saveUser() {
            const userData = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                cedula: document.getElementById('cedula').value,
                edad: parseInt(document.getElementById('edad').value),
                email: document.getElementById('email').value,
                usuario: document.getElementById('usuario').value,
                contraseña: document.getElementById('contraseña').value,
                rol: document.getElementById('rol').value,
                is_active: document.getElementById('is_active').value === 'true',
                empresa_id: null,
                telefono: document.getElementById('telefono').value,
                especialidad: document.getElementById('especialidad').value
            };
            
            if (userData.rol === 'empresa') {
                const empresaId = document.getElementById('empresa_id').value;
                if (!empresaId) { showAlert('Error', 'Debe seleccionar una empresa para el rol Empresa', 'error'); return; }
                userData.empresa_id = parseInt(empresaId);
            }
            
            try {
                if (currentEditId) { 
                    await UserService.update(currentEditId, userData); 
                    showAlert('Actualizado', 'Usuario actualizado exitosamente', 'success'); 
                } else { 
                    await UserService.create(userData); 
                    showAlert('Creado', 'Usuario creado exitosamente', 'success'); 
                }
                bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                await initDataTable();
            } catch (error) { showAlert('Error', 'Error al guardar: ' + error.message, 'error'); }
        }
        
        async function deleteUser(id) {
            const result = await Swal.fire({ title: '¿Estás seguro?', text: "No se puede deshacer", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', confirmButtonText: 'Sí, eliminar' });
            if (result.isConfirmed) { try { await UserService.delete(id); showAlert('Eliminado', 'Usuario eliminado', 'success'); await initDataTable(); } catch (error) { showAlert('Error', 'Error al eliminar', 'error'); } }
        }
        
        document.getElementById('toggleSidebar').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('closed'); document.getElementById('mainContent').classList.toggle('expanded'); });
        document.addEventListener('DOMContentLoaded', () => { initDataTable(); });
    </script>
</body>
</html>
